[package]
edition = "2021"
name = "zcash-trees"
version = "0.1.0"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0"
hex = "0.4"
rayon = "1.10"
thiserror = "2.0"

bincode = {version = "2.0", features = ["serde"]}
blake2b_simd = "1.0"
chacha20 = "0.9"
halo2_gadgets = "0.5"
halo2_proofs = "0.3"
jubjub = "0.10"
secp256k1 = "0.29"
zip32 = "0.2.1"

orchard = { git = "https://github.com/zcash-shielded-assets/orchard", rev = "7bc6c6f3b48ace8db768f3145f86ffb1593b83e0" }
sapling-crypto = { git = "https://github.com/hhanh00/sapling-crypto", rev = "bf29f9732eeaa417b63982aa8001acb542343b83" }
zcash_encoding = { git = "https://github.com/zcash-shielded-assets/librustzcash", rev = "c98b772d" }
zcash_protocol = { git = "https://github.com/zcash-shielded-assets/librustzcash", rev = "c98b772d", features = ["local-consensus"] }
zcash_transparent = { git = "https://github.com/zcash-shielded-assets/librustzcash", rev = "c98b772d", features = ["transparent-inputs"] }

incrementalmerkletree = {version = "0.8", optional = true}

[patch.crates-io]
orchard = { git = "https://github.com/zcash-shielded-assets/orchard", rev = "7bc6c6f3b48ace8db768f3145f86ffb1593b83e0" }
zcash_spec = { git = "https://github.com/zcash-shielded-assets/zcash_spec", rev = "d5e84264d2ad0646b587a837f4e2424ca64d3a05" }
sinsemilla = { git = "https://github.com/zcash/sinsemilla", rev = "aabb707e862bc3d7b803c77d14e5a771bcee3e8c" }
halo2_gadgets = { git = "https://github.com/zcash-shielded-assets/halo2", rev = "d687ce0e3e913549cab370ec66765e6d59d4612f" }
halo2_proofs = { git = "https://github.com/zcash-shielded-assets/halo2", rev = "d687ce0e3e913549cab370ec66765e6d59d4612f" }
halo2_poseidon = { git = "https://github.com/zcash-shielded-assets/halo2", rev = "d687ce0e3e913549cab370ec66765e6d59d4612f" }
zcash_note_encryption = { git = "https://github.com/zcash-shielded-assets/zcash_note_encryption", rev = "57d048381d376f71ce6ba753d7876ef04b6e57cb" }
