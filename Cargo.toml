[package]
edition = "2021"
name = "zcash-trees"
version = "0.1.0"

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0"
hex = "0.4"
rayon = "1.10"
thiserror = "2.0"

bincode = {version = "2.0", features = ["serde"]}
blake2b_simd = "1.0"
chacha20 = "0.9"
halo2_gadgets = "0.6"
halo2_proofs = "0.4"
jubjub = "0.11"
secp256k1 = "0.29"
zip32 = "0.3"

orchard = { git = "https://github.com/zcash-shielded-assets/orchard.git", rev = "533183ea431fbb99b79db72110ead88d71b5ba04" }
sapling-crypto = { git = "https://github.com/zcash-shielded-assets/sapling-crypto.git", rev = "b5538005f47213eca653a38617cfbb9a278c59bf" }
zcash_encoding = { git = "https://github.com/zcash-shielded-assets/librustzcash.git", rev = "48d974e452b3f3d6e0698d9bac9bdf0965b3d2af" }
zcash_protocol = { git = "https://github.com/zcash-shielded-assets/librustzcash.git", rev = "48d974e452b3f3d6e0698d9bac9bdf0965b3d2af", features = ["local-consensus"] }
zcash_transparent = { git = "https://github.com/zcash-shielded-assets/librustzcash.git", rev = "48d974e452b3f3d6e0698d9bac9bdf0965b3d2af", features = ["transparent-inputs"] }

incrementalmerkletree = {version = "0.9", optional = true}

# Standalone builds pin the same crypto family as zkool.
[patch.crates-io]
zcash_spec = { git = "https://github.com/zcash-shielded-assets/zcash_spec", rev = "d5e84264d2ad0646b587a837f4e2424ca64d3a05" }
halo2_gadgets = { git = "https://github.com/zcash-shielded-assets/halo2.git", rev = "0e3f1ea9dcba44fa4cd213b3f06b2aee3fc6e90e" }
halo2_proofs = { git = "https://github.com/zcash-shielded-assets/halo2.git", rev = "0e3f1ea9dcba44fa4cd213b3f06b2aee3fc6e90e" }
halo2_poseidon = { git = "https://github.com/zcash-shielded-assets/halo2.git", rev = "0e3f1ea9dcba44fa4cd213b3f06b2aee3fc6e90e" }
zcash_note_encryption = { git = "https://github.com/zcash-shielded-assets/zcash_note_encryption.git", rev = "54d2360c3b16561d7c00167dc0af7358251469c9" }
